name: Publish to PyPI

# Runs when you push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # 1. Never publish a broken release: run the full quality gate first.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy

  # 2. Build the sdist + wheel and hand them to the publish job.
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 3. Publish to PyPI via Trusted Publishing (OIDC) — no token stored anywhere.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/markov-protocols
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
